name: TERMIUS APK Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch upstream Termux source
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: master
          path: upstream
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Build real terminal APK
        working-directory: upstream
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Collect and checksum APKs
        run: |
          mkdir -p dist
          find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TERMIUS-Terminal-APK
          path: dist/
          retention-days: 30
